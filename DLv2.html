<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星辰幻想</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8b3dff">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星辰幻想"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e0a1c;--panel:#1b1433;--ac:#8b3dff;--tx:#f1ecff;--mu:#9a90c0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#2a1b55,var(--bg) 60%);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;max-width:900px;margin:auto}
h1{font-size:18px;margin:0}
.coin{background:var(--panel);padding:6px 12px;border-radius:20px;font-weight:700}
nav{display:flex;gap:6px;max-width:900px;margin:auto;padding:0 14px}
nav button{flex:1}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer}
button.alt{background:#352a5c}button:disabled{opacity:.4}
nav button.on{outline:2px solid #fff}
main{max-width:900px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,2vw,14px)}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.card{position:relative;aspect-ratio:3/4.3;border-radius:10px;padding:3px;background:#888;cursor:pointer;transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s,box-shadow .35s;will-change:transform}
.card.tilt{transition:transform .06s;box-shadow:0 14px 28px #000a}
.big .card{touch-action:none}
.card .in::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#fffa,transparent 42%);opacity:0;transition:opacity .3s}
.card.tilt .in::after{opacity:.55}
.card .in::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;mix-blend-mode:color-dodge;background:linear-gradient(115deg,transparent 15%,#ff3ea0aa 30%,#3effd0aa 45%,#ffe83eaa 60%,#7a3effaa 75%,transparent 90%);background-size:250% 250%;background-position:var(--bx,50%) var(--by,50%);transition:opacity .3s}
.card.tilt:not(.common) .in::before{opacity:.75}
.card.tilt.common .in::before{opacity:.25}
.card .in{position:absolute;inset:3px;border-radius:8px;overflow:hidden;background-color:hsl(var(--h) 50% 18%);background-size:cover;background-position:calc(50% + var(--tx,0px)) 25%;transition:background-position .1s}
.card .ic{position:absolute;inset:0;display:grid;place-items:center;transform:translate(var(--tx,0px),var(--ty,0px)) scale(1.08);transition:transform .1s;font-size:clamp(30px,9vw,60px);filter:drop-shadow(0 4px 6px #0008)}
.card .p{position:absolute;left:5px;top:1px;font-size:clamp(16px,4.5vw,26px);font-weight:900;font-style:italic;text-shadow:0 2px 3px #000}
.card .r{position:absolute;right:4px;top:4px;font-size:9px;background:#0009;padding:1px 5px;border-radius:4px;letter-spacing:.5px}
.card .n{position:absolute;left:5px;bottom:5px;font-size:10px;background:#000a;padding:2px 7px;border-radius:10px}
.card .sk{position:absolute;right:4px;bottom:4px;width:clamp(22px,6vw,34px);aspect-ratio:1;border-radius:50%;background:#000b;display:grid;place-items:center;font-size:clamp(11px,3vw,18px);border:1px solid #fff5}
.common{background:linear-gradient(135deg,#ddd,#777)}
.cosplay{background:linear-gradient(135deg,#3fe0a0,#1a7a66)}
.epic{background:linear-gradient(135deg,#4aa8ff,#2a3fd0)}
.legend{background:linear-gradient(135deg,#ff3b3b,#ffd33b,#3bff8a,#3bb2ff,#c43bff);background-size:300% 300%;animation:rb 3s linear infinite}
@keyframes rb{50%{background-position:100% 100%}}
.lock{filter:grayscale(1) brightness(.25);pointer-events:none}
.sel{outline:3px solid #ffd33b;outline-offset:2px}
.hit{animation:hit .5s}
@keyframes hit{30%{transform:scale(1.12) rotate(-2deg);box-shadow:0 0 22px #ffd33b}}
.dead{opacity:.35;filter:grayscale(1)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px}
.tip{color:var(--mu);font-size:13px}
.vs{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;padding:10px;border-radius:12px;background:linear-gradient(100deg,#c33 0 49%,#27f 51%)}
.vs b{font-size:26px;font-style:italic}
.hp{flex:1;text-align:center;font-weight:800}
.hp i{display:block;height:8px;border-radius:4px;background:#fff;margin-top:4px;transition:width .5s;width:100%}
.log{background:var(--panel);border-radius:10px;padding:10px;min-height:48px;font-size:14px;margin-top:10px}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9;padding:16px;overflow:auto}
.modal .box{background:var(--panel);border-radius:14px;padding:16px;max-width:520px;width:100%;text-align:center}
.big{width:min(220px,60vw);margin:10px auto}
.skill{background:var(--ac);border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.hide{display:none}
.sm{padding:6px 10px;font-size:13px}
.el{position:absolute;left:5px;top:clamp(30px,8vw,38px);width:clamp(15px,4.2vw,20px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(9px,2.4vw,12px);font-weight:900;color:#fff;border:1px solid #fffa;background:var(--ec);z-index:3}
.rv{animation:rv .7s both}.glow{filter:drop-shadow(0 0 10px #ffd33b)}
@keyframes rv{0%{transform:rotateY(180deg) scale(.5);opacity:0}60%{transform:rotateY(-12deg) scale(1.08);opacity:1}100%{transform:none}}
.dmg.crit{color:#ff5a5a;font-size:clamp(30px,9vw,52px)}.dmg.adv{color:#7dffb0}
.day{padding:8px 2px;border-radius:8px;background:#352a5c;font-size:12px}.day.on{background:var(--ac)}.day.done{opacity:.45}
.cn{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f5b82e 60%,#b57a0c);vertical-align:-.1em;margin-right:2px;box-shadow:0 0 0 1px #8a5a00}
.pile{display:inline-grid;place-items:center;width:30%;aspect-ratio:3/4.3;border-radius:10px;background:repeating-linear-gradient(45deg,#6a4fd8,#6a4fd8 8px,#5a3fc8 8px,#5a3fc8 16px);border:3px solid #ddd;font-size:30px;font-weight:900;margin:6px 0}
.banner{text-align:center;font-size:24px;font-weight:900;padding:8px;margin:8px 0;background:linear-gradient(90deg,transparent,#27f9,transparent)}
.banner.opp{background:linear-gradient(90deg,transparent,#e52b,transparent)}
.card.empty{background:#ffffff14;cursor:default}
.dmg{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-size:clamp(24px,7vw,40px);font-weight:900;color:#ffd33b;text-shadow:0 2px 0 #000,0 0 10px #f80;animation:up 1s forwards;pointer-events:none}
@keyframes up{0%{transform:scale(.4);opacity:1}30%{transform:scale(1.3)}100%{opacity:0;transform:translateY(-24px)}}
.act{outline:3px solid #ffd33b;outline-offset:2px}.tg{outline:3px dashed #ff5a5a;cursor:crosshair}.pt{width:min(192px,55vw);margin:0 auto 8px}.tx{font-size:16px;line-height:1.7;min-height:4em;text-align:left}
.ad{position:absolute;right:4px;top:4px;z-index:5;font-weight:900;font-size:22px;color:#7dff7d;text-shadow:0 0 4px #000}.ad.bad{color:#ff6b6b}
nav button{padding:10px 4px;font-size:14px}
</style></head><body>
<header><h1>✦ 星辰幻想</h1><span><button class="alt sm" id="snd"></button> <button class="alt sm" id="inst">安裝 App</button></span><div class="coin"><i class="cn"></i> <span id="coin"></span></div></header>
<nav><button data-v="battle">對戰</button><button data-v="gacha">抽卡</button><button data-v="album">圖鑑</button><button data-v="quest">任務</button><button data-v="shop">商店</button><button data-v="event">活動</button></nav>
<main id="app"></main>
<div id="modal" class="modal hide"></div>
<script>
const NM=['月影','星語','霜刃','焰舞','雷鳴','翠林','暮光','夜幕','白羽','赤霞','深海','天穹','幻蝶','鋼鐵','櫻吹'];
const TY=['法師','弓手','劍姬','賢者','刺客','女王','歌姬','暗影'];
const sv=(c,d)=>`<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.2em">${d}</svg>`;
const SK=[{i:sv('#ffb066','<path d="M4 20l3-1 12-12-2-2L5 17z"/><path d="M14 6l4 4"/>'),n:'反擊',d:'近距離攻擊對手時，若落敗仍會造成反擊傷害（自身戰力 30%）'},{i:sv('#6ff0b0','<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/>'),n:'治療',d:'每次對決後，為己方隊伍回復 3 點生命'},{i:sv('#ffe14a','<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>'),n:'雷擊',d:'對決時戰力額外提升 25%'}];
const RAR={common:'COMMON',cosplay:'cosplay',epic:'EPIC',legend:'LEGEND'};
const EL=['火','水','木','光','暗'],EC=['#e8451e','#2a8cff','#2fae4a','#d9a400','#7a3fd0'];
const emul=(a,b)=>{const w=[[0,2],[2,1],[1,0],[3,4],[4,3]];return w.some(([x,y])=>x==a&&y==b)?1.3:w.some(([x,y])=>x==b&&y==a&&x<3)?.8:1};
let AC;const snd=(f,d=.09,t='square',v=.05)=>{if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
const jingle=a=>a.forEach((f,i)=>setTimeout(()=>snd(f,.14,'triangle',.07),i*110));
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const POOL=[];
/* ===== 卡圖精靈圖(CSS Sprite)設定 =====
   換圖只需替換對應的 cards1~3.jpg：格線版面(欄×列)相同即可，任何解析度皆可，位置會依實際圖片尺寸自動換算。
   新增圖片檔時，在 sheets 加一筆即可；卡片編號依 sheets 順序、由左至右、由上而下連續對應。
   版面改變時，只需調整該張圖的 cols / rows / ref。 */
const SPRITE={
 ar:1.45,                     // 卡片圖框 高/寬 比
 top:.25,                     // 圖比圖框更高時，垂直裁切位置：0=靠上 1=靠下
 left:.5,                     // 圖比圖框更寬時，水平裁切位置：0=靠左 1=靠右
 sheets:[                     // ref=基準尺寸[寬,高]px；inset=每格內縮[左右,上下]px(去掉邊框)，皆以 ref 計
  {src:'cards1.jpg',cols:5,rows:3,ref:[1376,768],inset:[9,10]},
  {src:'cards2.jpg',cols:5,rows:3,ref:[1376,768],inset:[9,10]},
  {src:'cards3.jpg',cols:5,rows:3,ref:[1376,768],inset:[9,10]}
 ]
};
const sprStyle=document.head.appendChild(document.createElement('style')),sprCss=[];
function buildSheet(si,iw,ih){
 const{ar,top,left}=SPRITE,{src,cols,rows,ref:[rw,rh],inset:[ix,iy]}=SPRITE.sheets[si],
  base=SPRITE.sheets.slice(0,si).reduce((n,s)=>n+s.cols*s.rows,0),pc=n=>+(n*100).toFixed(4)+'%';let css='';
 for(let k=0;k<cols*rows;k++){
  const r=Math.floor(k/cols),c=k%cols;
  const fx=(c*rw/cols+ix)/rw,fw=(rw/cols-2*ix)/rw,fy=(r*rh/rows+iy)/rh,fh=(rh/rows-2*iy)/rh;
  const cw=fw*iw,ch=fh*ih,tall=ch>=cw*ar;                 // 等同 background-size:cover 的視窗計算
  const ww=tall?fw:ch/ar/iw,wh=tall?cw*ar/ih:fh;
  const wx=fx+left*(fw-ww),wy=fy+top*(fh-wh);
  css+=`.card .in.a${base+k+1}{background-image:url(${src});background-repeat:no-repeat;background-size:${pc(1/ww)} ${pc(1/wh)};background-position:${pc(wx/(1-ww))} ${pc(wy/(1-wh))}}`;
 }
 sprCss[si]=css;sprStyle.textContent=sprCss.join('');
}
SPRITE.sheets.forEach((sh,i)=>{buildSheet(i,...sh.ref);
 Object.assign(new Image(),{onload(){buildSheet(i,this.naturalWidth,this.naturalHeight)},src:sh.src})});

const DATA=[["common", 7, 1], ["common", 2, 1], ["cosplay", 5, 1], ["cosplay", 5, 2], ["legend", 50, 3], ["common", 10, 0], ["common", 15, 1], ["cosplay", 23, 2], ["epic", 25, 0], ["legend", 35, 0], ["common", 17, 1], ["common", 28, 3], ["legend", 29, 1], ["epic", 30, 1], ["legend", 30, 2], ["common", 25, 0], ["common", 24, 4], ["legend", 25, 4], ["epic", 36, 1], ["legend", 37, 3], ["common", 30, 3], ["common", 32, 1], ["common", 38, 3], ["epic", 40, 0], ["legend", 40, 1], ["common", 35, 2], ["epic", 36, 3], ["legend", 36, 0], ["epic", 45, 1], ["legend", 45, 4], ["common", 38, 1], ["legend", 40, 0], ["legend", 45, 1], ["legend", 45, 0], ["legend", 50, 1],
 /* 36-45：新增卡（對應 cards3.jpg 第 6~15 格）[稀有度, 戰力, 屬性(0火 1水 2木 3光 4暗)] */
 ["epic", 38, 3], ["epic", 34, 1], ["epic", 41, 0], ["cosplay", 22, 2], ["legend", 46, 3],
 ["cosplay", 24, 4], ["common", 30, 0], ["common", 20, 2], ["cosplay", 19, 0], ["common", 27, 4]];
DATA.forEach(([r,p,el],k)=>{const id=k+1;POOL.push({id,r,p,el,sk:id%3,h:(id*37)%360,name:NM[id%15]+TY[id%8]})});

const DEF=()=>({coins:300,own:{},deck:[],page:0,w:0,l:0,stage:1,sel:1,pity:0,daily:{d:'',s:0},mute:0,sty:{},qc:{},pulls:0,manual:0,dust:0,tut:0,fast:0,dq:null,tk:0,shop:null,ev:null});let S=DEF();
try{const x=JSON.parse(localStorage.getItem('cb2')||'null');if(x)S=x}catch(e){}
S=Object.assign(DEF(),S);
const save=()=>{try{localStorage.setItem('cb2',JSON.stringify(S))}catch(e){}$('#coin').textContent=S.coins;const sb=$('#snd');if(sb)sb.textContent='音效 '+(S.mute?'關':'開')};
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pw=(c,lv)=>c.p+(lv||0);
const lvOf=id=>S.own[id]||0;
function card(c,o={}){const lv=o.lv!==undefined?o.lv:Math.max(0,lvOf(c.id)-1);
return `<div class="card ${c.r} ${o.cls||''}" data-id="${c.id}" style="--h:${c.h}"><div class="in a${c.id}"><span class="p">${o.p!==undefined?o.p:pw(c,lv)}</span><span class="r">${RAR[c.r]}</span><span class="n">NO.${c.id}</span><span class="el" style="--ec:${EC[c.el]}">${EL[c.el]}</span><span class="sk">${SK[c.sk].i}</span></div></div>`}
function view(v){S.view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({battle,gacha,album,quest,shop,event:evPage})[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));
function modal(h){const m=$('#modal');m.innerHTML=`<div class="box">${h}<p><button onclick="$('#modal').classList.add('hide')">關閉</button></p></div>`;m.classList.remove('hide')}
function detail(id){const c=POOL[id-1],lv=Math.max(0,lvOf(id)-1),s=SK[c.sk];
modal(`<h3>${c.name} <span class="tip">Lv+${lv}</span></h3><div class="big">${card(c,{lv})}</div><div>屬性 ${EL[c.el]}｜戰力 <b>${pw(c,lv)}</b></div><div class="skill">${s.i} ${s.n}：${s.d}</div><p>${lv<5?`<button id="up">強化 → Lv+${lv+1}（星塵 ${UC(lv)}）</button>`:'已強化至滿級'} <span class="tip">持有星塵 ${S.dust||0}</span></p>`);
const u=$('#up');if(u)u.onclick=()=>{if((S.dust||0)<UC(lv)){u.textContent='星塵不足（重複抽到滿等卡、對戰與每日任務可得）';return}S.dust-=UC(lv);S.own[id]++;save();snd(660);detail(id)}}
document.addEventListener('click',e=>{const k=e.target.closest('[data-det]');if(k&&lvOf(+k.dataset.det))detail(+k.dataset.det)});

/* 圖鑑 */
function album(){const pages=Math.ceil(POOL.length/9),pg=POOL.slice(S.page*9,S.page*9+9),have=Object.keys(S.own).length;
$('#app').innerHTML=`<div class="bar"><b>圖鑑 ${S.page+1}/${pages}</b><span class="tip">已收集 ${have}/${POOL.length}</span></div>
<div class="grid">${pg.map(c=>`<div data-det="${c.id}">${card(c,{cls:lvOf(c.id)?'':'lock'})}</div>`).join('')}</div>
<div class="bar"><button class="alt" id="pv">◀ 上一頁</button><button class="alt" id="nx">下一頁 ▶</button></div>
<p class="tip">滑鼠移到卡牌上（手機可按住拖曳）可看 3D 傾斜與全息閃光。點擊卡牌查看技能。重複抽到同一張卡，戰力 +1（最多 +5）。</p>`;
$('#pv').onclick=()=>{S.page=(S.page+pages-1)%pages;album()};$('#nx').onclick=()=>{S.page=(S.page+1)%pages;album()}}

/* 抽卡 */
const DU={common:5,cosplay:10,epic:25,legend:60},UC=lv=>20*(lv+1);
function draw(){const x=rnd()*100;const r=x<2?'legend':x<10?'epic':x<30?'cosplay':'common';const l=POOL.filter(c=>c.r===r);return l[Math.floor(Math.random()*l.length)]}
const pickR=r=>{const l=POOL.filter(c=>c.r===r);return l[Math.floor(Math.random()*l.length)]};
function pull(){S.pity++;S.pulls=(S.pulls||0)+1;dqs().p++;const c=S.pity>=30?pickR('legend'):draw();if(c.r=='epic'||c.r=='legend')S.pity=0;return c}
function gacha(){$('#app').innerHTML=`<div class="bar"><b>召喚</b><span class="tip">機率：傳說 2%｜史詩 8%｜Cosplay 20%｜普通 70%</span></div>
<div class="bar"><button id="g1">單抽 <i class="cn"></i>30</button><button id="g10">十連 <i class="cn"></i>270</button></div>
<p class="tip">保底：十連至少 1 張史詩以上；連續 30 抽未出史詩以上，第 30 抽必出傳說（目前 ${S.pity}/30）。重複卡牌戰力 +1。</p>
<div style="margin-top:10px"><button class="alt" id="rs">重置進度</button></div>`;
const go=n=>{const cost=n==10?270:30;if(S.coins<cost)return modal('金幣不足！去對戰賺取吧。');S.coins-=cost;
const got=Array.from({length:n},pull);if(n==10&&!got.some(c=>c.r=='epic'||c.r=='legend')){got[9]=pickR(Math.random()<.2?'legend':'epic');S.pity=0}let du=0;got.forEach(c=>{if((S.own[c.id]||0)>=6){du+=DU[c.r];S.dust=(S.dust||0)+DU[c.r]}else S.own[c.id]=(S.own[c.id]||0)+1});
if(!S.deck.length)autoDeck();save();
modal(`<h3>獲得卡牌</h3><div class="grid wide">${got.map((c,i)=>`<div class="rv ${c.r=='legend'?'glow':''}" style="animation-delay:${i*.18}s">${card(c,{lv:0})}</div>`).join('')}</div>${du?`<p class="tip">滿等重複卡轉為星塵 +${du}</p>`:''}`);got.forEach((c,i)=>setTimeout(()=>snd(c.r=='legend'?880:c.r=='epic'?660:440,.12,'triangle',.06),i*180+300));if(got.some(c=>c.r=='legend'))setTimeout(()=>jingle([523,659,784,1047]),n*180+400)};
$('#g1').onclick=()=>go(1);$('#g10').onclick=()=>go(10);
$('#rs').onclick=()=>{if(confirm('確定重置？')){S=DEF();firstGift();save();view('gacha')}}}
function firstGift(){for(let i=0;i<6;i++){const c=POOL.filter(c=>c.r==='common')[i*2];S.own[c.id]=1}autoDeck()}
function autoDeck(){S.deck=POOL.filter(c=>lvOf(c.id)).sort((a,b)=>pw(b,lvOf(b.id)-1)-pw(a,lvOf(a.id)-1)).slice(0,6).map(c=>c.id)}
if(!Object.keys(S.own).length)firstGift();

const tot=s=>[...s.f,...s.r].reduce((a,x)=>a+(x?Math.max(0,x.hp):0),0),cnt=s=>s.f.filter(x=>x).length+s.r.length;

const pile=(n,r)=>`<div style="text-align:${r?'right':'left'}"><div class="pile">${n}</div></div>`;
const paint=(label,opp)=>{$('#app').innerHTML=`<div class="tip">第 ${st} 關${boss?'（BOSS）':''}｜Guest ${tot(E)} ｜ Deacon ${tot(M)}</div>${pile(E.r.length,0)}<div class="grid">${row(E,'e')}</div><div class="banner ${opp?'opp':''}">${label}</div><div class="grid">${row(M,'m')}</div>${pile(M.r.length,1)}<div class="log" id="log"></div>${S.manual?'<button class="alt" id="au">自動完成本回合</button>':''}`};
const pop=(k,i,t,x='')=>{const e=$('.s'+k+i);if(e){e.classList.add('hit');e.insertAdjacentHTML('beforeend',`<div class="dmg ${x}">${t}</div>`)}};
const log=t=>{const l=$('#log');if(l)l.innerHTML=t};
let au=0;const pick=(i,B,j)=>new Promise(r=>{if(au)return r(j);const m=$('.sm'+i);m&&m.classList.add('act');log('點選要攻擊的敵人');
[0,1,2].forEach(k=>{const e=$('.se'+k);if(e&&B.f[k]){e.classList.add('tg');e.onclick=()=>r(k);const em=emul(M.f[i].c.el,B.f[k].c.el);if(em!=1)e.insertAdjacentHTML('beforeend',`<div class="ad ${em<1?'bad':''}">${em>1?'▲':'▼'}</div>`)}});const b=$('#au');if(b)b.onclick=()=>{au=1;r(j)}});
async function turn(A,B,ka,kb,label,opp){
if(A===M)au=0;paint(label,opp);await sl(900);
A.f.forEach(u=>{if(u&&u.c.sk==1){const w=A.f.filter(x=>x).sort((a,b)=>a.hp-b.hp)[0];w.hp+=5}});paint(label,opp);
for(let i=0;i<3;i++){const a=A.f[i];if(!a)continue;let j=B.f[i]?i:B.f.findIndex(x=>x);if(j<0)break;if(S.manual&&A===M)j=await pick(i,B,j);const d=B.f[j];
const em=emul(a.c.el,d.c.el),cr=Math.random()<.15;const dmg=Math.round(a.hp*(a.c.sk==2?1.25:1)*em*(cr?1.5:1));d.hp-=dmg;pop(kb,j,'-'+dmg,cr?'crit':em>1?'adv':'');snd(cr?880:em>1?520:300,.1);let t=`${a.c.name} 攻擊 ${d.c.name}，造成 ${dmg}${cr?'（暴擊！）':''}${em>1?'（屬性剋制）':em<1?'（屬性被剋）':''}`;
if(d.c.sk==0&&d.hp>0){const k=Math.round(d.hp*.3);a.hp-=k;pop(ka,i,'-'+k);t+=`｜${SK[0].i} 反擊 ${k}`}
log(t);await sl(1000);if(d.hp<=0)B.f[j]=null;if(a.hp<=0)A.f[i]=null;paint(label,opp);log(t)}
for(const s of[A,B])for(let i=0;i<3;i++)if(!s.f[i]&&s.r.length)s.f[i]=s.r.shift();
paint(label,opp);await sl(600)}
let win=null;
for(let n=0;n<10&&win===null;n++){
await turn(M,E,'m','e','我的回合 My Turn',0);if(!cnt(E)){win=true;break}
await turn(E,M,'e','m','對手回合 Opponent\'s Turn',1);if(!cnt(M)){win=false;break}}
if(win===null)win=tot(M)>=tot(E);
let rw=10,first=false;{const q=dqs();q.b++;if(win){q.w++;const v=evS();v.w++;if(boss)v.b++}}if(win){S.w++;first=st===S.stage;rw=Math.round((30+8*st+(boss?50:0))*(first?2:1)*1.5);S.dust=(S.dust||0)+(boss?8:3);if(first&&S.stage<30){S.stage++;S.sel=S.stage}jingle([523,659,784])}else{S.l++;snd(160,.4,'sawtooth')}S.coins+=rw;save();
modal(`<h2>${win?'勝利！':'敗北'}</h2><p>第 ${st} 關${boss?'（BOSS）':''}｜我方剩餘 ${Math.round(tot(M))}｜對手 ${Math.round(tot(E))}</p><p>獲得 <i class="cn"></i>${rw}${first?'（首通雙倍）':''}${win?`＋星塵 ${boss?8:3}`:''}</p>`);
$('#modal button').onclick=()=>{$('#modal').classList.add('hide');if(win&&boss&&!S.sty['o'+st]){S.sty['o'+st]=1;const ci=(st-1)/5|0,R=(ci+1)*100;S.coins+=R;save();story(CH[ci].o.concat([[0,'章節獎勵 '+R+' 金幣已入帳']]),battle)}else battle()}}
/* 3D 傾斜 + 全息 */
let tc=null;const clr=c=>{if(!c)return;c.classList.remove('tilt');['--rx','--ry','--tx','--ty'].forEach(k=>c.style.removeProperty(k))};
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c!==tc){clr(tc);tc=c}
if(!c||c.classList.contains('lock'))return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
c.classList.add('tilt');const st=c.style;st.setProperty('--rx',((0.5-y)*26).toFixed(1)+'deg');st.setProperty('--ry',((x-0.5)*26).toFixed(1)+'deg');
st.setProperty('--mx',x*100+'%');st.setProperty('--my',y*100+'%');st.setProperty('--bx',x*100+'%');st.setProperty('--by',y*100+'%');
st.setProperty('--tx',((0.5-x)*10).toFixed(1)+'px');st.setProperty('--ty',((0.5-y)*10).toFixed(1)+'px')});
document.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'){clr(tc);tc=null}});
document.addEventListener('pointerleave',()=>{clr(tc);tc=null},true);
const DAY=[50,60,80,100,120,150,300],ld=x=>x.toLocaleDateString('sv');
function checkDaily(){const t=ld(new Date()),d=S.daily;if(d.d===t)return;const y=ld(new Date(Date.now()-864e5)),st=d.d===y?d.s%7:0,amt=DAY[st];
modal(`<h3>每日登入獎勵</h3><div class="grid" style="grid-template-columns:repeat(7,1fr)">${DAY.map((v,i)=>`<div class="day ${i==st?'on':i<st?'done':''}">第${i+1}天<br><i class="cn"></i>${v}</div>`).join('')}</div><p>連續登入 ${st+1} 天，可領 <i class="cn"></i>${amt}</p><p><button id="clm">領取</button></p>`);
$('#clm').onclick=()=>{S.coins+=amt;S.daily={d:t,s:st+1};save();snd(660);$('#modal').classList.add('hide')}}
let dp=null;const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
addEventListener('appinstalled',()=>$('#inst').classList.add('hide'));
$('#snd').onclick=()=>{S.mute=S.mute?0:1;save();snd(600)};
$('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;return}
const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
modal(`<h3>安裝成 App</h3>${ios?'<div class="skill">iPhone／iPad（Safari）：點「分享」→「加入主畫面」</div>':''}<div class="skill">Android（Chrome）：右上角「⋮」→「安裝應用程式」</div><div class="skill">電腦（Chrome／Edge）：網址列右側的安裝圖示</div><p class="tip">需用 HTTPS 網址開啟（例如 GitHub Pages、Netlify）；安裝後可離線遊玩。</p>`)};
if(standalone())$('#inst').classList.add('hide');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
save();view('battle');S.tut?checkDaily():(S.tut=1,save(),story(TUT,checkDaily));
</script></body></html>
